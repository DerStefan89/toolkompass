name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node einrichten
        uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          # cache: 'npm' erst wieder aktivieren, sobald das Projekt echte
          # Abhängigkeiten und eine package-lock.json hat — sonst bricht
          # setup-node mit "Dependencies lock file is not found" ab.

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Lint, Typecheck, Doku-Gate
        run: npm run check

      - name: Secret-Scan (gitleaks)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source /repo --no-git -v
